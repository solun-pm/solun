when:
  - event: [push, manual]

# Beide Images werden gebaut und ausgerollt: solun-api und solun-web.
# apps/web/Dockerfile baut seit dem Umbau zur Bauzeit statt beim Containerstart;
# die NEXT_PUBLIC_*-Werte kommen deshalb hier als build_args rein. Aendert sich
# einer davon, muss neu gebaut werden - ein Neustart genuegt nicht.

steps:
  - name: tags
    image: registry.local.phanes.net/dockerhub/library/node:20-alpine
    commands:
      - VERSION=$(node -p "require('./apps/api/package.json').version")
      - printf '%s\nlatest\n' "$VERSION" > .tags
      - echo "Tags fuer diesen Build:" && cat .tags

  - name: build-push-api
    image: woodpeckerci/plugin-docker-buildx:6.1.1
    settings:
      registry: registry.local.phanes.net
      repo: registry.local.phanes.net/solun-pm/solun-api
      dockerfile: apps/api/Dockerfile
      platforms: linux/amd64
      tags_file: .tags
      username:
        from_secret: harbor_user
      password:
        from_secret: harbor_token
    depends_on: [tags]

  - name: build-push-web
    image: woodpeckerci/plugin-docker-buildx:6.1.1
    settings:
      registry: registry.local.phanes.net
      repo: registry.local.phanes.net/solun-pm/solun-web
      dockerfile: apps/web/Dockerfile
      platforms: linux/amd64
      tags_file: .tags
      build_args:
        - NEXT_PUBLIC_API_URL=https://api.solun.pm
      username:
        from_secret: harbor_user
      password:
        from_secret: harbor_token
    depends_on: [tags]

  - name: deploy-tag
    image: registry.local.phanes.net/dockerhub/alpine/git:latest
    environment:
      FORGEJO_USER:
        from_secret: forgejo_user
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - VERSION=$(head -1 .tags)
      - git clone -q "https://$FORGEJO_USER:$FORGEJO_TOKEN@git.local.phanes.net/phanes-io/infra-stacks.git" /tmp/infra
      - cd /tmp/infra
      # Muster ohne "image: " - Doppelpunkt mit Leerzeichen wuerde die YAML-Zeile brechen
      - sed -i "s#solun-pm/solun-api:[A-Za-z0-9._-]*#solun-pm/solun-api:$VERSION#" solun01/solun/docker-compose.yml
      - sed -i "s#solun-pm/solun-web:[A-Za-z0-9._-]*#solun-pm/solun-web:$VERSION#" solun01/solun/docker-compose.yml
      - git config user.email "ci-bot@phanes.net"
      - git config user.name "CI Bot"
      - |
        if git diff --quiet; then
          echo "Tags unveraendert ($VERSION) - kein Commit noetig"
        else
          git commit -am "solun: Image-Tags auf $VERSION (Pipeline $CI_PIPELINE_NUMBER)"
          git push origin main
          echo "Tags $VERSION nach infra-stacks gepusht"
        fi
    depends_on: [build-push-api, build-push-web]
